[build]
builder = "nixpacks"
buildCommand = "cd ../.. && corepack enable && pnpm config set dangerouslyAllowAllBuilds true && pnpm install --frozen-lockfile && pnpm --filter @workspace/db exec tsc -p tsconfig.json && pnpm --filter @workspace/api-server run build"

[deploy]
startCommand = "node dist/index.mjs"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
