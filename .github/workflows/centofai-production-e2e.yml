name: CentofAi Production E2E

on:
  workflow_dispatch:

jobs:
  project-request-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run project request E2E
        env:
          CENTOFAI_API_URL: ${{ secrets.CENTOFAI_API_URL }}
          CENTOFAI_E2E_EMAIL: ${{ secrets.CENTOFAI_E2E_EMAIL }}
        run: node scripts/e2e-project-request.mjs
