name: CentofAi Phase 6 Check

on:
  push:
    branches:
      - centofai-rebuild-phase6
  pull_request:
    branches:
      - main

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck CentofAi
        run: pnpm --filter @workspace/centofai run typecheck

      - name: Build CentofAi
        run: pnpm --filter @workspace/centofai run build
